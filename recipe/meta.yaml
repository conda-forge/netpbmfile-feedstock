{% set name = "netpbmfile" %}
{% set version = "2026.10.15" %}
{% set sha256 = "fd8b646c34aeccfe7f7dc221843790a558fa2c5ede6d8d8df795010b14f4c4ba" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  noarch: python
  entry_points:
    - netpbmfile = netpbmfile.netpbmfile:main

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - numpy
    - python >={{ python_min }}

test:
  imports:
    - netpbmfile
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://www.cgohlke.com/
  summary: Read and write Netpbm files
  license: BSD-3-Clause
  license_file: LICENSE
  description: |
    Netpbmfile is a Python library to read and write image files in the Netpbm or related formats
    (PBM, PGM, PPM, PNM, PAM, PGX, PF, Pf, PF4, XV).
  dev_url: https://github.com/cgohlke/netpbmfile/

extra:
  recipe-maintainers:
    - cgohlke
    - goanpeca
